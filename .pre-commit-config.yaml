repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        types: [python]
      - id: gate
        name: local gate (pytest + mypy)
        entry: bash -c 'uv run pytest -q && uv run mypy core'
        language: system
        pass_filenames: false
        stages: [pre-push]
